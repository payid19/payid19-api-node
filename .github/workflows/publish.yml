name: Publish to npm

# Publishing is driven by a GitHub Release, so a new version goes out from the
# Releases page with no local tooling.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets npm attach a provenance attestation, so the npm page shows where
      # and from which commit the tarball was built.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag ($tag) does not match package.json version ($pkg)." >&2
            echo "Update the version in package.json, or retag the release." >&2
            exit 1
          fi

      # Separates an unusable token from a token that authenticates but is not
      # allowed to publish — the two produce very similar publish errors.
      - name: Check the token authenticates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error title=npm authentication failed::The NPM_TOKEN secret is missing, expired, or not a valid npm token. npm said: ${who}"
            exit 1
          fi
          echo "Authenticated to npm as ${who}."

      # npm's reason for refusing a publish is the one thing worth knowing when
      # this fails, and a raw non-zero exit does not carry it, so it is
      # promoted to an annotation that shows on the run summary.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          out="$(npm publish --provenance --access public 2>&1)"
          code=$?
          echo "$out"

          if [ "$code" -ne 0 ]; then
            reason="$(
              printf '%s\n' "$out" \
                | grep -iE '^npm (error|warn)' \
                | grep -viE 'npm error (A complete log|command|argv|node v|npm v|cwd|code E?[0-9]+$)' \
                | sed -E 's/(npm_[A-Za-z0-9_-]{8,})/[redacted]/g' \
                | head -6 \
                | tr '\n' '|'
            )"
            echo "::error title=npm publish failed::${reason:-no npm error line found; see the step log}"
          fi

          exit "$code"
